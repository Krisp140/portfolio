    const svg = d3.select("#sketch1").append("svg")
      .attr("viewBox", `0 0 ${width} ${height}`).attr("width", "100%");
    const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

    const x = d3.scaleTime().domain(d3.extent(smoothed, d => d.date)).range([0, iw]);
    const y = d3.scaleLinear().domain([0, d3.max(smoothed, d => d.avgCases) * 1.05]).range([ih, 0]);

    // Grid
    g.append("g").attr("class", "grid")
      .call(d3.axisLeft(y).ticks(5).tickSize(-iw).tickFormat(""));

    // Area
    g.append("path").datum(smoothed)
      .attr("d", d3.area().x(d => x(d.date)).y0(ih).y1(d => y(d.avgCases)).curve(d3.curveMonotoneX))
      .attr("fill", "rgba(194,55,40,0.10)");

    // Line
    g.append("path").datum(smoothed)
      .attr("d", d3.line().x(d => x(d.date)).y(d => y(d.avgCases)).curve(d3.curveMonotoneX))
      .attr("fill", "none").attr("stroke", "#c23728").attr("stroke-width", 2);

    // Axes
    g.append("g").attr("class", "axis").attr("transform", `translate(0,${ih})`)
      .call(d3.axisBottom(x).ticks(d3.timeMonth.every(3)).tickFormat(d3.timeFormat("%b '%y")).tickSizeOuter(0));
    g.append("g").attr("class", "axis")
      .call(d3.axisLeft(y).ticks(5).tickFormat(d => d >= 1e6 ? (d/1e6).toFixed(1)+"M" : d >= 1e3 ? (d/1e3).toFixed(0)+"K" : d).tickSizeOuter(0));

    // Title
    svg.append("text").attr("x", margin.left).attr("y", 20)
      .attr("font-size", "15px").attr("font-weight", "600").text("New COVID-19 Cases in the U.S. (7-day average)");
    svg.append("text").attr("x", margin.left).attr("y", 36)
      .attr("font-size", "11px").attr("fill", "#888").text("January 2020 – September 2022");

    // Annotations
    const waves = [
      { date: "2020-04-10", label: "First wave", dy: -12 },
      { date: "2021-01-08", label: "Winter '20–'21", dy: -12 },
      { date: "2021-04-10", label: "Vaccines", dy: -30 },
      { date: "2021-09-01", label: "Delta", dy: -12 },
      { date: "2022-01-10", label: "Omicron", dy: -12 },
    ];
    waves.forEach(a => {
      const ad = d3.timeParse("%Y-%m-%d")(a.date);
      const nearest = smoothed.reduce((p, c) => Math.abs(c.date - ad) < Math.abs(p.date - ad) ? c : p);
      const px = x(nearest.date), py = y(nearest.avgCases);
      g.append("circle").attr("cx", px).attr("cy", py).attr("r", 3).attr("fill", "#c23728");
      g.append("line").attr("x1", px).attr("y1", py + a.dy).attr("x2", px).attr("y2", py + a.dy - 16)
        .attr("stroke", "#999").attr("stroke-width", 0.7);
      g.append("text").attr("x", px).attr("y", py + a.dy - 20)
        .attr("text-anchor", "middle").attr("font-size", "10.5px").attr("font-weight", "600").text(a.label);
    });

    // Y-axis label
    svg.append("text").attr("x", 14).attr("y", margin.top + ih / 2)
      .attr("transform", `rotate(-90,14,${margin.top + ih / 2})`)
      .attr("text-anchor", "middle").attr("font-size", "10px").attr("fill", "#888").text("New cases (7-day avg)");
  }

  // ════════════════════════════════════════
  // SKETCH 2: Small multiples by year
  // ════════════════════════════════════════
  {
    const margin = { top: 30, right: 20, bottom: 35, left: 55 };
    const panelH = 160;
    const gap = 15;
    const years = [2020, 2021, 2022];
    const width = 760;
    const height = margin.top + years.length * panelH + (years.length - 1) * gap + margin.bottom;
    const iw = width - margin.left - margin.right;
    const ih = panelH - 30;

    const svg = d3.select("#sketch2").append("svg")
      .attr("viewBox", `0 0 ${width} ${height}`).attr("width", "100%");

    // Shared y-scale across all panels
    const yMax = d3.max(smoothed, d => d.avgCases);
    const yScale = d3.scaleLinear().domain([0, yMax * 1.05]).range([ih, 0]);

    // X scale: day-of-year (0–365) mapped to months
    const monthDates = d3.range(0, 12).map(m => new Date(2020, m, 1));
    const xScale = d3.scaleLinear().domain([0, 365]).range([0, iw]);

    const colors = { 2020: "#e8a04c", 2021: "#c23728", 2022: "#2b6ca3" };

    years.forEach((yr, i) => {
      const yOff = margin.top + i * (panelH + gap);
      const g = svg.append("g").attr("transform", `translate(${margin.left},${yOff})`);

      // Filter data for this year
      const yearData = smoothed.filter(d => d.date.getFullYear() === yr).map(d => {
        const jan1 = new Date(yr, 0, 1);
        const dayOfYear = Math.floor((d.date - jan1) / 86400000);
        return { ...d, doy: dayOfYear };
      });

      // Grid
      g.append("g").attr("class", "grid")
        .call(d3.axisLeft(yScale).ticks(3).tickSize(-iw).tickFormat(""));

      // Area
      g.append("path").datum(yearData)
        .attr("d", d3.area().x(d => xScale(d.doy)).y0(ih).y1(d => yScale(d.avgCases)).curve(d3.curveMonotoneX))
        .attr("fill", d3.color(colors[yr]).copy({opacity: 0.15}));

      // Line
      g.append("path").datum(yearData)
        .attr("d", d3.line().x(d => xScale(d.doy)).y(d => yScale(d.avgCases)).curve(d3.curveMonotoneX))
        .attr("fill", "none").attr("stroke", colors[yr]).attr("stroke-width", 2);

      // Year label
      g.append("text").attr("x", -8).attr("y", ih / 2)
        .attr("text-anchor", "end").attr("font-size", "13px").attr("font-weight", "700")
        .attr("fill", colors[yr]).attr("dominant-baseline", "middle").text(yr);

      // X axis on bottom panel only
      if (i === years.length - 1) {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const monthStarts = months.map((m, mi) => {
          const d = new Date(2020, mi, 1);
          const jan1 = new Date(2020, 0, 1);
          return Math.floor((d - jan1) / 86400000);
        });
        const axis = g.append("g").attr("class", "axis").attr("transform", `translate(0,${ih})`);
        axis.append("line").attr("x1", 0).attr("x2", iw).attr("stroke", "#ccc");
        monthStarts.forEach((doy, mi) => {
          axis.append("text").attr("x", xScale(doy + 15)).attr("y", 16)
            .attr("text-anchor", "middle").attr("font-size", "10px").attr("fill", "#888").text(months[mi]);
        });
      }

      // Bottom line
      g.append("line").attr("x1", 0).attr("x2", iw).attr("y1", ih).attr("y2", ih).attr("stroke", "#ddd");

      // Y axis ticks
      g.append("g").attr("class", "axis")
        .call(d3.axisLeft(yScale).ticks(3)
          .tickFormat(d => d >= 1e6 ? (d/1e6).toFixed(1)+"M" : d >= 1e3 ? (d/1e3).toFixed(0)+"K" : "0")
          .tickSizeOuter(0));
    });

    // Title
    svg.append("text").attr("x", margin.left).attr("y", 18)
      .attr("font-size", "14px").attr("font-weight", "600").text("New COVID-19 Cases by Year (shared scale, 7-day avg)");
  }

  // ════════════════════════════════════════
  // SKETCH 3: Proportional circles — total cases by year
  // ════════════════════════════════════════
  {
    const width = 760, height = 340;
    const svg = d3.select("#sketch3").append("svg")
      .attr("viewBox", `0 0 ${width} ${height}`).attr("width", "100%");

    // Aggregate total cases per year
    const yearTotals = [
      { year: 2020, cases: 0, deaths: 0 },
      { year: 2021, cases: 0, deaths: 0 },
      { year: 2022, cases: 0, deaths: 0 },
    ];
    data.forEach(d => {
      const yr = d.date.getFullYear();
      const entry = yearTotals.find(y => y.year === yr);
      if (entry) { entry.cases += d.newCases; entry.deaths += d.newDeaths; }
    });
    // 2022 only goes through Sep — note for label
    const note2022 = "(Jan–Sep)";

    const colors = { 2020: "#e8a04c", 2021: "#c23728", 2022: "#2b6ca3" };

    // Area-proportional radius: r = sqrt(cases / PI)
    const maxR = 130;
    const maxCases = d3.max(yearTotals, d => d.cases);
    const rScale = d => Math.sqrt(d.cases / maxCases) * maxR;

    // Position circles left to right
    const cy = height / 2 + 10;
    const positions = [160, 380, 600];

    // Title
    svg.append("text").attr("x", 30).attr("y", 24)
      .attr("font-size", "16px").attr("font-weight", "600")
      .text("How COVID Grew: Total Cases by Year");
    svg.append("text").attr("x", 30).attr("y", 42)
      .attr("font-size", "11px").attr("fill", "#888")
      .text("Circle area is proportional to total confirmed cases");

    yearTotals.forEach((d, i) => {
      const cx = positions[i];
      const r = rScale(d);

      // Circle
      svg.append("circle")
        .attr("cx", cx).attr("cy", cy).attr("r", r)
        .attr("fill", colors[d.year]).attr("fill-opacity", 0.18)
        .attr("stroke", colors[d.year]).attr("stroke-width", 2);

      // Year label inside
      svg.append("text")
        .attr("x", cx).attr("y", cy - 6)
        .attr("text-anchor", "middle")
        .attr("font-size", "22px").attr("font-weight", "700")
        .attr("fill", colors[d.year])
        .text(d.year);

      // Case count inside
      const casesLabel = d.cases >= 1e6
        ? (d.cases / 1e6).toFixed(1) + "M"
        : (d.cases / 1e3).toFixed(0) + "K";
      svg.append("text")
        .attr("x", cx).attr("y", cy + 16)
        .attr("text-anchor", "middle")
        .attr("font-size", "13px").attr("fill", colors[d.year])
        .text(casesLabel + " cases");

      // Deaths below
      const deathsLabel = d.deaths >= 1e6
        ? (d.deaths / 1e6).toFixed(1) + "M"
        : (d.deaths / 1e3).toFixed(0) + "K";
      svg.append("text")
        .attr("x", cx).attr("y", cy + 32)
        .attr("text-anchor", "middle")
        .attr("font-size", "10px").attr("fill", "#999")
        .text(deathsLabel + " deaths");

      // Partial-year note for 2022
      if (d.year === 2022) {
        svg.append("text")
          .attr("x", cx).attr("y", cy + 46)
          .attr("text-anchor", "middle")
          .attr("font-size", "9px").attr("fill", "#bbb")
          .text(note2022);
      }
    });
  }

})();
</script>

</body>
